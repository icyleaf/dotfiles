# Dual LG 4K on AMD Navi 10: use pro-audio so both HDMI/DP outputs
# appear as separate sinks (ACP only activates one HDMI profile at a time).
#
# session.suspend-timeout-seconds = 0 keeps these HDMI/DP PCMs running when
# idle. When the sink suspends, the display sees the audio stream stop, mutes
# its speakers, and takes several seconds to re-lock the stream on resume
# (e.g. a browser video unpausing). Keeping silence flowing avoids that mute.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_03_00.1"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_03_00.1.pro-output-8"
      }
    ]
    actions = {
      update-props = {
        node.nick = "LG HDR 4K (1)"
        node.description = "LG HDR 4K (1)"
        device.description = "LG HDR 4K DisplayPort 1"
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_03_00.1.pro-output-10"
      }
    ]
    actions = {
      update-props = {
        node.nick = "LG HDR 4K (2)"
        node.description = "LG HDR 4K (2)"
        device.description = "LG HDR 4K DisplayPort 2"
        session.suspend-timeout-seconds = 0
      }
    }
  }
  # Hide empty HDMI/DP connectors (no monitor attached).
  {
    matches = [
      {
        node.name = "~alsa_output\\.pci-0000_03_00\\.1\\.pro-output-(3|7|9|11)"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
